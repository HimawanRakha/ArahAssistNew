<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Notch | Arah Assist</title>
    <!-- Ditampilkan oleh desktop/main.cjs saat server Arah Assist belum bisa dihubungi -->
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      }
      .notch {
        box-sizing: border-box;
        width: 340px;
        height: 44px;
        margin: 0 auto;
        padding: 0 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: #0c1d32;
        color: #fffbfc;
        border-radius: 0 0 22px 22px;
        box-shadow: 0 18px 40px -18px rgba(12, 29, 50, 0.55);
        font-size: 13px;
        font-weight: 600;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f5c518;
        flex: none;
        animation: pulse 1.6s ease-in-out infinite;
      }
      .muted {
        margin-left: auto;
        color: #d9e2e9;
        font-weight: 500;
        font-size: 12px;
        white-space: nowrap;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="notch" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span>Server Arah Assist belum berjalan</span>
      <span class="muted" id="server"></span>
    </div>
    <script>
      const server = new URLSearchParams(location.search).get("server") || "";
      document.getElementById("server").textContent = server.replace(/^https?:\/\//, "");
    </script>
  </body>
</html>
